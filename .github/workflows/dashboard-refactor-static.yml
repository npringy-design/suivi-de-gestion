name: Dashboard static refactor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dashboard-refactor-static.yml'
      - 'scripts/dashboardRefactorStaticCodemod.ts'

permissions:
  contents: write

jobs:
  apply-dashboard-static-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply Dashboard static refactor
        run: npm run refactor:dashboard-static

      - name: Verify Dashboard refactor
        run: npm run verify:dashboard-refactor

      - name: Commit refactor result
        run: |
          if git diff --quiet; then
            echo "No Dashboard refactor changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dashboard.tsx
          git commit -m "Apply Dashboard static refactor"
          git push
